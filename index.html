<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="icon.png">
    <title>To do app</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <div class="total-container">
    <header>
        <h2>Write your Task</h2>
         <button type="button" class="del-allBtn">Delete all</button>
        <span id="time">date</span>
        <button type="button" id="darkModeBtn"> Dark Mode</button>
    </header>
        <form id="input-form">
         <div class="task-inputBox">
            <input type="text" id="input-value" placeholder="Enter your task" required>
            <button type="submit" class="add-btn">ADD</button>
    <div class="selectOption">
    <select class="workOption">
        <option value="">Select Work Type</option>
        <option value="personal">Personal Work</option>
        <option value="important">Professional Work</option>
    </select>
    <!-- Priority -->
    <select class="priorityOption">
        <option value="">Select Priority</option>
        <option value="high">High Priority</option>
        <option value="low">Low Priority</option>
    </select>
    <input type="text" class="dueDate" placeholder="Select Date" onfocus="this.type='date'; this.showPicker();" >
         </div>
            </div>
        </form>
        <ul id="tasks-container">
            Nothing to show (Please add your task)
        </ul>
    </div> <!--end-->
    <script src="script.js"></script>
</body>
</html>
